# The demo fleet: three honest verifiers and the demo-only dishonest one.
# Reads keys and endpoints from .env in this directory (see .env.example):
#
#   docker compose up --build -d
#   docker compose logs -f
name: arkify

# Verifiers only make outbound connections, so no ports are published. The limits keep a heavy
# compile from starving whatever else runs on the host.
x-verifier: &verifier
  build: .
  restart: unless-stopped
  mem_limit: ${VERIFIER_MEMORY:-1200m}
  cpus: ${VERIFIER_CPUS:-1.0}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  volumes:
    - solc:/data

x-endpoints: &endpoints
  ARKIFY_VERIFY_MEMORY_MB: ${ARKIFY_VERIFY_MEMORY_MB:-768}
  ARKIV_RPC_URL: ${ARKIV_RPC_URL}
  ARKIV_WS_URL: ${ARKIV_WS_URL}
  SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
  MAINNET_RPC_URL: ${MAINNET_RPC_URL}

services:
  verifier-a:
    <<: *verifier
    environment:
      <<: *endpoints
      VERIFIER_NAME: verifier-a
      VERIFIER_PRIVATE_KEY: ${VERIFIER_A_PRIVATE_KEY}
  verifier-b:
    <<: *verifier
    environment:
      <<: *endpoints
      VERIFIER_NAME: verifier-b
      VERIFIER_PRIVATE_KEY: ${VERIFIER_B_PRIVATE_KEY}
  verifier-c:
    <<: *verifier
    environment:
      <<: *endpoints
      VERIFIER_NAME: verifier-c
      VERIFIER_PRIVATE_KEY: ${VERIFIER_C_PRIVATE_KEY}
  # Demo only. Attests full_match to everything, to show that trust filtering catches it.
  evil:
    <<: *verifier
    environment:
      <<: *endpoints
      VERIFIER_NAME: evil
      VERIFIER_PRIVATE_KEY: ${EVIL_PRIVATE_KEY}
      VERIFIER_EVIL: "1"

# A fixed subnet, so the fleet can be told apart from other projects' networks in firewall rules.
networks:
  default:
    ipam:
      config:
        - subnet: ${ARKIFY_SUBNET:-172.30.42.0/24}

volumes:
  solc:
